name: yt_rabbit_hole
channels:
  - defaults
  - anaconda
  - conda-forge
dependencies:
    - altair
    - pip
    - pandas
    - python=3.10
    - nb_conda
    - ipywidgets
    - pip:
        - -e .
        - asciitree
        - jupyterlab
        - multiprocessing_logging
        - jupyterlab_code_formatter
        - nbdime
        - setproctitle
        - tabulate
        - tqdm
        - networkx
        - matplotlib
        - bokehgraph
